# Testprofil: die Tests laufen gegen dieselbe PostgreSQL-Datenbank wie der Mock (docker compose up -d).
# Vor jedem Test werden die Tabellen geleert und die Startbestände aus data.sql neu eingespielt.
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/sapmock}
    username: ${DB_USERNAME:sapmock}
    password: ${DB_PASSWORD:sapmock}
