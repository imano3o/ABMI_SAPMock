# Test profile: the tests run against the same PostgreSQL database as the mock (docker compose up -d).
# Before each test the tables are emptied and the initial stock from data.sql is loaded again.
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/sapmock}
    username: ${DB_USERNAME:sapmock}
    password: ${DB_PASSWORD:sapmock}
