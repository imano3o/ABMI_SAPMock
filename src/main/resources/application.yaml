server:
  port: 8081

spring:
  application:
    name: sap-mock
  datasource:
    # Postgres DB
    url: ${DB_URL:jdbc:postgresql://localhost:5432/sapmock}
    username: ${DB_USERNAME:sapmock}
    password: ${DB_PASSWORD:sapmock}
  jpa:
    hibernate:
      # On every start the tables are recreated and filled from data.sql,
      # so every demo starts with the same stock. After a stop, the data is kept for inspection.
      ddl-auto: create
    # run data.sql only after Hibernate has created the tables
    defer-datasource-initialization: true
    open-in-view: false
  sql:
    init:
      mode: always
