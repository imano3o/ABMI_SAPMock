# PostgreSQL for the SAP mock. Start: docker compose up -d
# Credentials match the defaults in src/main/resources/application.yaml.
services:
  postgres:
    image: postgres:17-alpine
    container_name: sapmock-postgres
    environment:
      POSTGRES_DB: sapmock
      POSTGRES_USER: sapmock
      POSTGRES_PASSWORD: sapmock
    ports:
      - "5432:5432"
    volumes:
      # Data survives a stop; the mock still recreates the tables on every start
      - sapmock-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sapmock -d sapmock"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  sapmock-data:
